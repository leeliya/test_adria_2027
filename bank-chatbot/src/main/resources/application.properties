spring.application.name=bank-chatbot
server.port=8083
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.mcp.client.streamablehttp.connections.account.url=http://localhost:8081
spring.ai.mcp.client.streamablehttp.connections.transaction.url=http://localhost:8082